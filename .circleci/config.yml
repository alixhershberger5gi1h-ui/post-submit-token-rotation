            mkdir -p /tmp/pre-upgrade-metadata-extraction
            echo 'auditBuildDependencies fallback-image-upload' | tee /tmp/pre-upgrade-metadata-extraction/Adapter > /dev/null
            wc -c < /tmp/pre-upgrade-metadata-extraction/Adapter
